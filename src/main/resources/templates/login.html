<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="login-box">
        <h1>Sign In</h1>

        <div th:if="${error}" class="error" role="alert" aria-live="polite">
            <p th:text="${error}">Invalid username or password.</p>
        </div>

        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                th:value="${username}"
                required
                autofocus
                autocomplete="username"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
            >

            <button type="submit">Log In</button>
        </form>

        <p class="hint">
            Any username and password is accepted - there's no validation.
        </p>
    </div>
</body>
</html>
