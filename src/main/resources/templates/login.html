<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="login-box">
        <h1>Sign In</h1>

        <div class="error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                th:value="${username}"
                required
                autofocus
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button type="submit">Log In</button>
        </form>

        <p class="hint">
            Demo users: admin/admin123, john/password1, mary/letmein42
        </p>
    </div>
</body>
</html>
