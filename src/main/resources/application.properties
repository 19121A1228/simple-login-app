spring.application.name=simple-login-app
server.port=8080

# --- H2 in-memory datasource (no passwords/secrets) ---
spring.datasource.url=jdbc:h2:mem:simplelogindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Initialize schema/data from schema.sql and data.sql ---
spring.sql.init.mode=always

# --- Session timeout ---
server.servlet.session.timeout=30m

# --- Optional: H2 console (demo) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
